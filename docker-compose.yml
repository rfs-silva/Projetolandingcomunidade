services:
  postgres:
    image: postgres:16-alpine
    container_name: comunidade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comunidade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comunidade}
      POSTGRES_DB: ${POSTGRES_DB:-comunidade}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comunidade} -d ${POSTGRES_DB:-comunidade}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: comunidade-landing:latest
    container_name: comunidade-landing
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-comunidade}:${POSTGRES_PASSWORD:-comunidade}@postgres:5432/${POSTGRES_DB:-comunidade}?schema=public
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL:-http://localhost:3000}
      - AUTH_TRUST_HOST=true
      - AUTH_GITHUB_ID=${AUTH_GITHUB_ID}
      - AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET}
      # LGPD: contato do encarregado de dados (DPO). Em prod, defina no .env.
      - DPO_EMAIL=${DPO_EMAIL:-}
      # Liga login dev de empresa (sem magic link). Padrão OFF em produção.
      - ENABLE_DEV_COMPANY_LOGIN=${ENABLE_DEV_COMPANY_LOGIN:-}
      # URL pública usada em sitemap/robots e canonical tags.
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-}
      # Roda seed mesmo em produção (use só pra bootstrap inicial).
      - RUN_SEED=${RUN_SEED:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
